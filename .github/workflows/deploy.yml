name: Deploy Lambda Image

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URI=$(echo "$ECR_REPOSITORY_URL" | cut -d'/' -f1)
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY_URI"

      - name: Build Docker image
        working-directory: src
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          IMAGE_URI="${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          docker build --platform linux/amd64 -t "$IMAGE_URI" .

      - name: Push image to ECR
        run: |
          docker push "$IMAGE_URI"

      - name: Update Lambda to new image
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI"

      - name: Print deployed image
        run: |
          echo "Lambda atualizada com a imagem: $IMAGE_URI"
